name: Triage Layer CI

on:
  push:
    branches: [main]
    paths:
      - "triage/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "triage/**"
      - "tests/**"

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r triage/requirements.txt

      - name: Lint with ruff
        run: ruff check triage tests

      - name: Type check with mypy
        run: mypy triage

      - name: Security audit dependencies with pip-audit
        # Note: pip-audit queries an external vulnerability DB over HTTP and may occasionally experience network latency/flakiness.
        run: pip-audit --desc

      - name: Run pytest unit test suite
        run: pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t soc-triage:ci triage/
